# Story 17.1: local/single-host orchestration — db -> migrate -> api -> frontend, in that
# dependency order. Every secret-shaped value below is read from the environment (see
# .env.example at the repo root; docker compose auto-loads a sibling .env, which is already
# git-ignored per the root .gitignore) rather than baked into this file, per T17.1.3's "no
# per-env appsettings secrets" — the committed appsettings.json defaults (empty Paymob keys, the
# documented local-dev-only Jwt signing key) only ever apply if you don't set the override.
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_SA_PASSWORD:?set DB_SA_PASSWORD in .env}
    volumes:
      - crowdcoffee-db-data:/var/opt/mssql
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # One-shot: applies pending EF Core migrations, then exits. The api service below waits for
  # this to succeed rather than migrating itself on boot (server/Dockerfile.migrate explains why).
  migrate:
    build:
      context: server
      dockerfile: Dockerfile.migrate
    environment:
      Database__ConnectionString: Server=db;Database=CrowdCoffee;User Id=sa;Password=${DB_SA_PASSWORD};TrustServerCertificate=True
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: server
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      Database__ConnectionString: Server=db;Database=CrowdCoffee;User Id=sa;Password=${DB_SA_PASSWORD};TrustServerCertificate=True
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY in .env — do not reuse the committed local-dev placeholder}
      Jwt__Issuer: CrowdCoffee
      Jwt__Audience: CrowdCoffee.Staff
      Cors__AllowedOrigins__0: ${FRONTEND_ORIGIN:-http://localhost:8080}
      Paymob__ApiKey: ${PAYMOB_API_KEY:-}
      Paymob__IntegrationId: ${PAYMOB_INTEGRATION_ID:-0}
      Paymob__IframeId: ${PAYMOB_IFRAME_ID:-}
      Paymob__HmacSecret: ${PAYMOB_HMAC_SECRET:-}
      Paymob__PublicApiBaseUrl: ${PUBLIC_API_BASE_URL:-http://localhost:8080}
      Paymob__PublicFrontendBaseUrl: ${FRONTEND_ORIGIN:-http://localhost:8080}
    ports:
      - "5076:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
      args:
        # Left unset on purpose: nginx.conf reverse-proxies /api, /hubs, /uploads to the api
        # service under the same origin, so the src/api/*.ts default of '/api' is already
        # correct — see frontend/Dockerfile's own comment.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  crowdcoffee-db-data:
