# Story 17.1: mirrors vite.config.ts's dev-server proxy (same three prefixes: /api, /hubs,
# /uploads -> the API) so the SPA and API present as one origin in the Docker Compose topology,
# same as they do under `npm run dev`. "api" below is the docker-compose service name, resolved
# via Docker's embedded DNS — not a real hostname outside this network.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Epic 12: SignalR negotiates over HTTP then upgrades to a WebSocket — the Upgrade/Connection
    # headers below are what let that upgrade pass through instead of being dropped.
    location /hubs/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /uploads/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }

    # Vue Router history mode: any path not matched above falls back to index.html so
    # client-side routing handles it instead of nginx 404ing a hard refresh on e.g. /menu.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
